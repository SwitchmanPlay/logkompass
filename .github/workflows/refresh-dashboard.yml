name: Refresh honeypot dashboard

# Pulls a fresh stats snapshot from the sensor, regenerates the charts, and
# commits them so the GitHub Pages dashboard stays current. The sensor holds no
# git credentials — the SSH key lives only in the SENSOR_SSH_KEY repo secret.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # and on demand from the Actions tab

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: write

env:
  SENSOR_HOST: 92.5.188.26
  SENSOR_PORT: "62222"
  SENSOR_USER: ubuntu

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install charting deps
        run: pip install --quiet matplotlib

      - name: Configure SSH key
        env:
          SENSOR_SSH_KEY: ${{ secrets.SENSOR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SENSOR_SSH_KEY" > ~/.ssh/sensor
          chmod 600 ~/.ssh/sensor

      - name: Export fresh stats from the sensor
        # The CI key is locked to a forced command on the sensor
        # (/usr/local/bin/logkompass-ci-export), so any connection just prints
        # the attack-stats JSON — no command or stdin is sent.
        run: |
          ssh -i ~/.ssh/sensor -p "$SENSOR_PORT" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SENSOR_USER@$SENSOR_HOST" > docs/findings/stats.json
          python -c "import json;d=json.load(open('docs/findings/stats.json'));print('events', d['totals']['events'])"

      - name: Regenerate charts
        run: python tools/make_charts.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/findings/stats.json docs/findings/*.png
          if git diff --cached --quiet; then
            echo "No dashboard changes."
          else
            git commit -m "chore(dashboard): refresh honeypot data [skip ci]"
            git push
          fi
